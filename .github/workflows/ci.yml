name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run internal unit tests
        run: python -m pytest -c pytest.ini -v

      - name: Check code and style
        run: python scripts/check_code.py

  distribution:
    name: Validate distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/saspytest-wheel-env"
          "$RUNNER_TEMP/saspytest-wheel-env/bin/python" -m pip install --upgrade pip
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          "$RUNNER_TEMP/saspytest-wheel-env/bin/python" -m pip install "$wheel"
          "$RUNNER_TEMP/saspytest-wheel-env/bin/python" -m pip install pytest-mock

      - name: Run internal unit tests from installed wheel
        run: "$RUNNER_TEMP/saspytest-wheel-env/bin/python -m pytest -c pytest.ini -v"

      - name: Install source distribution in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/saspytest-sdist-env"
          "$RUNNER_TEMP/saspytest-sdist-env/bin/python" -m pip install --upgrade pip
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          "$RUNNER_TEMP/saspytest-sdist-env/bin/python" -m pip install "$sdist"
          "$RUNNER_TEMP/saspytest-sdist-env/bin/python" -m pip install pytest-mock

      - name: Run internal unit tests from installed source distribution
        run: "$RUNNER_TEMP/saspytest-sdist-env/bin/python -m pytest -c pytest.ini -v"
