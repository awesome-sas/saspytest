[pytest]
testpaths =
    tests/unit
python_files =
    test_*.py
    *_test.py
# Disable cache to avoid permission issues in dev containers
cache_dir = /tmp/pytest_cache
# Disable parallel execution to prevent session conflicts
addopts = -p no:xdist -p no:saspytest
markers =
    integration: marks tests that require a live SAS connection (deselect with '-m "not integration"')
# Suppress SASpy UserWarnings about ERRORs in logs during testing
# (many tests intentionally generate errors to validate error handling)
filterwarnings =
    ignore::UserWarning:saspy.sasioiom
    ignore::UserWarning:saspy.sasiostdio
    ignore::UserWarning:saspy.sasiohttp
    ignore::UserWarning:saspy.sasiocom
